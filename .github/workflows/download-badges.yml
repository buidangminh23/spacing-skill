name: Update download badges
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: download-badges
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/update-download-badges.mjs
      - name: Publish badges
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/badges/npm-downloads.svg assets/badges/npm-downloads-month.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: refresh npm download badges'
          git pull --rebase origin main
          git push origin HEAD:main
